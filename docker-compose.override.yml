services:
  web:
    build:
      target: dev
    command: sh -c "npx prisma migrate deploy && npm run dev"
    environment:
      NODE_ENV: development
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - ./data/manga:${MANGA_STORAGE_DIR:-/data/manga}

  worker:
    build:
      target: dev
    command: npm run worker
    environment:
      NODE_ENV: development
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - ./data/manga:${MANGA_STORAGE_DIR:-/data/manga}
