services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    command: sh -c "npx prisma migrate deploy && npm run start"
    working_dir: /app
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-manhwa}:${POSTGRES_PASSWORD:-manhwa}@db:5432/${POSTGRES_DB:-manhwa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      MANGA_STORAGE_DIR: ${MANGA_STORAGE_DIR:-/data/manga}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./data/manga:${MANGA_STORAGE_DIR:-/data/manga}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    command: npm run worker:prod
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-manhwa}:${POSTGRES_PASSWORD:-manhwa}@db:5432/${POSTGRES_DB:-manhwa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      MANGA_STORAGE_DIR: ${MANGA_STORAGE_DIR:-/data/manga}
      NODE_ENV: production
    volumes:
      - ./data/manga:${MANGA_STORAGE_DIR:-/data/manga}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manhwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manhwa}
      POSTGRES_DB: ${POSTGRES_DB:-manhwa}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manhwa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
      TZ: UTC
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: manhwa_pgdata
  redisdata:
  node_modules:
